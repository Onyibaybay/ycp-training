<!-- 1. Complete the course registration form
2. Create a form to submit a file upload 
3. Create another form to select age brackets within 10 years starting from 1970 to 2020, 
assign a name each group and add submit button
4. Create a form that will accept a range slider from 0 - 20. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onyi Assignment</title>
</head>
<body>
    <h2>Course Registration Form</h2>
    <form action="">
        <div>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="course">Course:</label><br>
            <input type="text" id="course" name="course" required><br><br>

            <button type="submit">Register</button>
        </div>
    </form>



<h2>File Upload Form</h2>
<form enctype="multipart/form-data">
  <label for="myfile">Upload your file:</label><br>
  <input type="file" id="myfile" name="myfile" required><br><br>

  <button type="submit">Submit</button>
</form>


<h2>Age Bracket Selection</h2>
<form>
  <label for="age">Select Age Bracket:</label><br>
  <select id="age" name="age">
    <option value="1970-1980">1970 - 1980</option>
    <option value="1981-1990">1981 - 1990</option>
    <option value="1991-2000">1991 - 2000</option>
    <option value="2001-2010">2001 - 2010</option>
    <option value="2011-2020">2011 - 2020</option>
  </select><br><br>

  <button type="submit">Submit</button>
</form>

<h2>Range Slider Form</h2>
<form>
  <label for="range">Choose a number (0 - 20):</label><br>
  <input type="range" id="range" name="range" min="0" max="20" value="10" oninput="output.value = this.value"><br>
  <small><i><output id="output" fontsize="10">10</output></i></small>
  <br><br>

  <button type="submit">Submit</button>

</form>
</body>
</html>
